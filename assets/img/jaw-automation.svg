<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Computer vision-based jaw crusher automation</title>
  <desc id="description">A CCTV camera and AI vision panel monitor rock in a jaw crusher feeder and signal automated feed controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#263445"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#CBD5E1" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1440" height="760" fill="url(#background)"/>
  <rect width="1440" height="760" fill="url(#grid)"/>
  <path d="M0 620h1440" stroke="#CBD5E1" stroke-opacity=".12"/>

